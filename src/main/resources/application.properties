# Configuration de l'application Spring Boot pour GestionPhotos

# Port du serveur (par défaut 8080)
server.port=8080

# Configuration du stockage des fichiers
# Chemin où les photos seront stockées (relatif au répertoire de travail ou absolu)
# Pour Windows en développement : .\photos-storage
# Pour Raspberry Pi en production : /home/pi/photo-storage
app.storage.path=./photos-storage

# Configuration des uploads
# Taille maximale d'un fichier (en octets) - 10 Mo par défaut
app.upload.max-file-size=10485760

# Types MIME autorisés pour l'upload (séparés par des virgules)
app.upload.allowed-mime-types=image/jpeg,image/png,image/gif,image/webp,image/jpg

# Configuration Spring
# Désactiver le cache des templates (utile en développement)
spring.thymeleaf.cache=false

# Configuration pour le développement
# Afficher plus de détails dans les logs
logging.level.org.springframework.web=DEBUG
logging.level.com.example.gestionphotos=DEBUG

# Configuration CORS (pour Angular en développement)
# Le controller utilise @CrossOrigin, mais on peut aussi configurer globalement
spring.mvc.cors.allowed-origins=http://localhost:4200
spring.mvc.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.mvc.cors.allowed-headers=*
spring.mvc.cors.allow-credentials=true

# Configuration pour la production (à activer avec spring.profiles.active=prod)
# spring.profiles.active=prod
